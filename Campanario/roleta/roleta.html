<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Roleta da Dor — Sina de Ferro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Source+Serif+4:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-raised:#171b23; --bg-panel:#1b1f28; --line:#322a24; --line-soft:#23262e;
    --rust:#a1512e; --rust-bright:#c96a3c; --brass:#b89a5d;
    --ruin:#7a2530; --ruin-bright:#a53a3a;
    --paper:#d9d2c1; --paper-dim:#8d8878; --paper-faint:#5f5c52;
    --font-display:'Cinzel',serif; --font-body:'Source Serif 4',serif; --font-mono:'JetBrains Mono',monospace;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:transparent; color:var(--paper); font-family:var(--font-body); padding: 4px 4px 28px; }

  .aviso {
    font-family: var(--font-mono); font-size: 11px; color: var(--paper-dim);
    background: var(--bg-panel); border: 1px solid var(--line); border-radius: 4px;
    padding: 10px 14px; margin-bottom: 22px;
  }
  .aviso strong { color: var(--ruin-bright); }

  .palco {
    display: flex; flex-wrap: wrap; gap: 36px; align-items: flex-start;
  }

  /* ---------- Roda ---------- */
  .roda-wrap {
    position: relative;
    width: min(340px, 90vw);
    flex-shrink: 0;
    margin: 0 auto;
  }

  .ponteiro {
    position: absolute;
    top: -6px; left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 11px solid transparent;
    border-right: 11px solid transparent;
    border-top: 18px solid var(--brass);
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5));
    z-index: 3;
  }

  .roda-aro {
    position: relative;
    border-radius: 50%;
    border: 5px solid var(--bg-panel);
    box-shadow: 0 0 0 2px var(--line), inset 0 0 22px rgba(0,0,0,0.6), 0 12px 30px rgba(0,0,0,0.45);
    overflow: hidden;
  }

  svg#roda {
    display: block;
    width: 100%;
    height: auto;
    transition: transform 3.6s cubic-bezier(0.13, 0.7, 0.06, 1);
  }

  .cubo {
    position: absolute; top: 50%; left: 50%;
    width: 15%; height: 15%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #e6d6a8, var(--brass) 55%, #46390f 100%);
    box-shadow: 0 0 0 3px var(--bg-panel), 0 2px 6px rgba(0,0,0,0.5);
    z-index: 2;
  }

  .controles { text-align: center; margin-top: 22px; }

  button#girarBtn {
    font-family: var(--font-display);
    font-size: 15px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--paper);
    background: linear-gradient(180deg, var(--rust), #7a3a1e);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 12px 30px;
    cursor: pointer;
    box-shadow: 0 3px 0 #5c2c14, 0 4px 10px rgba(0,0,0,0.4);
  }
  button#girarBtn:hover:not(:disabled) { filter: brightness(1.12); }
  button#girarBtn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #5c2c14; }
  button#girarBtn:disabled { opacity: 0.55; cursor: default; }

  /* ---------- Resultado ---------- */
  .resultado-col { flex: 1; min-width: 260px; }

  .resultado-card {
    background: var(--bg-panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 20px 22px; min-height: 132px;
  }

  .resultado-card .placeholder {
    font-family: var(--font-mono); font-size: 13px; color: var(--paper-faint);
    padding: 20px 0;
  }

  .resultado-numero {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--rust-bright); margin-bottom: 6px;
  }

  .resultado-nome {
    font-family: var(--font-display); font-size: 21px; color: var(--paper);
    margin: 0 0 10px;
  }

  .resultado-efeito {
    font-size: 15px; line-height: 1.6; color: var(--paper);
  }
  .resultado-efeito strong { color: var(--rust-bright); }

  .historico { margin-top: 18px; }
  .historico-label {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--paper-faint); margin-bottom: 8px;
  }
  .historico-lista { display: flex; flex-wrap: wrap; gap: 6px; }
  .historico-chip {
    font-family: var(--font-mono); font-size: 11px; color: var(--paper-dim);
    border: 1px solid var(--line); border-radius: 3px; padding: 3px 8px;
    background: var(--bg-raised);
  }
</style>
</head>
<body>

  <div class="aviso">
    Ativa a partir do <strong>3º estágio de Maré de Sangue</strong> + pelo menos <strong>1</strong> no contador da Ruína (Núcleo, seção 12.4). Sorteie uma vez por rodada — o efeito vale até o fim daquela rodada.
  </div>

  <div class="palco">
    <div class="roda-wrap">
      <div class="ponteiro"></div>
      <div class="roda-aro">
        <svg id="roda" viewBox="0 0 300 300"></svg>
      </div>
      <div class="cubo"></div>
      <div class="controles">
        <button id="girarBtn">Girar a Roleta</button>
      </div>
    </div>

    <div class="resultado-col">
      <div class="resultado-card" id="resultadoCard">
        <div class="placeholder">Gire a roleta para sortear o efeito desta rodada.</div>
      </div>

      <div class="historico">
        <div class="historico-label">Sorteios recentes</div>
        <div class="historico-lista" id="historicoLista"></div>
      </div>
    </div>
  </div>

<script>
  const DADOS = [
    { n: 1,  nome: "Sem Recuar!",           efeito: "Ninguém pode usar a Ação de Movimento para se afastar de um inimigo." },
    { n: 2,  nome: "Sangue Fervendo",       efeito: "Todo dano causado nesta rodada (físico ou mágico) ganha <strong>+1d4</strong> fixo." },
    { n: 3,  nome: "Fome de Lâminas",       efeito: "A margem de crítico de todos os ataques aumenta em 1 (ex: 19-20) até o fim da rodada." },
    { n: 4,  nome: "Guarda Escancarada",    efeito: "Ninguém pode usar a Ação Reativa nesta rodada — toda defesa fica só na sorte do dado." },
    { n: 5,  nome: "Grito da Ruína",        efeito: "A Ação Bônus só pode ser usada para atacar ou avançar; nada de cura, item ou manobra defensiva." },
    { n: 6,  nome: "Chão que Sangra",       efeito: "Ao fim do turno de cada personagem, quem estiver adjacente a outro combatente sofre <strong>1d4</strong> de dano de impacto (ignora Redução de Dano)." },
    { n: 7,  nome: "Fúria Contagiante",     efeito: "Sempre que alguém sofrer dano corpo a corpo, pode gastar a Ação Reativa (se ainda tiver) para devolver <strong>1d4</strong> de dano automático ao atacante." },
    { n: 8,  nome: "Vento Feroz",           efeito: "Deslocamentos usados para se aproximar de um inimigo ganham <strong>+1 espaço</strong> extra nesta rodada." },
    { n: 9,  nome: "Marca do Colapso",      efeito: "Quem terminar o turno sem ter atacado ou conjurado perde <strong>1 PV</strong>, consumido pela instabilidade do mundo." },
    { n: 10, nome: "Eco Duplo",             efeito: "Todo ataque corpo a corpo bem-sucedido permite um ataque extra imediato contra o mesmo alvo, com <strong>-4</strong> no teste, sem custo de ação." },
    { n: 11, nome: "Chuva de Cascalho",     efeito: "Uma tempestade de destroços cai sobre a arena: todos sofrem <strong>1 de dano fixo</strong> ao fim da rodada (ignora Redução de Dano)." },
    { n: 12, nome: "Recarga Frenética",     efeito: "Ataques à distância não gastam munição/carga nesta rodada — mas quem puder atacar é <strong>obrigado</strong> a fazê-lo." },
    { n: 13, nome: "Mão Pesada",            efeito: "Dano de arma corpo a corpo é rolado <strong>duas vezes</strong>; usa-se o maior resultado, +1 fixo." },
    { n: 14, nome: "Presságio de Sangue",   efeito: "Magias causam <strong>+1d4</strong> de dano extra nesta rodada, mas custam <strong>+1 Mana</strong> a mais — o mundo cobra seu preço." },
    { n: 15, nome: "Última Gota",           efeito: "Se um ataque zerar o PV de um alvo nesta rodada, o atacante pode imediatamente atacar outro alvo ao alcance, de graça." },
    { n: 16, nome: "Fervura Coletiva",      efeito: "A Redução de Dano (física e mágica) de todos cai pela metade, arredondado para baixo, só nesta rodada." },
    { n: 17, nome: "Julgamento do Confronto", efeito: "Em todo Teste de Confronto resolvido nesta rodada, quem perder sofre <strong>1d4</strong> de dano adicional." },
    { n: 18, nome: "Sem Alívio",            efeito: "Curas de qualquer tipo (magia, item, recuperação) são reduzidas à metade nesta rodada." },
    { n: 19, nome: "Investida Selvagem",    efeito: "Quem se mover ao menos 2 espaços antes de atacar corpo a corpo ganha <strong>+1d4</strong> de dano nesse ataque." },
    { n: 20, nome: "Colapso Total",         efeito: "Todos sofrem <strong>1d4</strong> de dano fixo (ignora Redução de Dano) ao fim da rodada, e a Maré de Sangue avança <strong>um estágio extra</strong> só nesta rodada (volta ao normal na seguinte)." },
  ];

  const FATIA = 360 / DADOS.length;
  const CX = 150, CY = 150, R = 148, R_LABEL = 112;
  const COR_A = "#1b1f28";
  const COR_B = "#23262e";
  const COR_20 = "#7a2530";

  function polar(cx, cy, r, angDeg) {
    const rad = (angDeg - 90) * Math.PI / 180;
    return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
  }

  function montarRoda() {
    const svg = document.getElementById("roda");
    let html = "";
    DADOS.forEach((d, i) => {
      const a0 = i * FATIA;
      const a1 = (i + 1) * FATIA;
      const p0 = polar(CX, CY, R, a0);
      const p1 = polar(CX, CY, R, a1);
      const cor = d.n === 20 ? COR_20 : (i % 2 === 0 ? COR_A : COR_B);
      html += `<path d="M${CX},${CY} L${p0.x.toFixed(2)},${p0.y.toFixed(2)} A${R},${R} 0 0,1 ${p1.x.toFixed(2)},${p1.y.toFixed(2)} Z" fill="${cor}" stroke="#322a24" stroke-width="1"/>`;

      const mid = a0 + FATIA / 2;
      const lp = polar(CX, CY, R_LABEL, mid);
      const corTexto = d.n === 20 ? "#e6b9b9" : "#c96a3c";
      html += `<text x="${lp.x.toFixed(2)}" y="${lp.y.toFixed(2)}" fill="${corTexto}" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle">${d.n}</text>`;
    });
    svg.innerHTML = html;
  }

  let totalDeg = 0;
  let girando = false;
  const historico = [];

  function girar() {
    if (girando) return;
    girando = true;
    document.getElementById("girarBtn").disabled = true;

    const idx = Math.floor(Math.random() * DADOS.length);
    const jitter = (Math.random() - 0.5) * (FATIA * 0.6);
    const centroFatia = idx * FATIA + FATIA / 2 + jitter;

    const atualMod = ((totalDeg % 360) + 360) % 360;
    const desejadoMod = (360 - centroFatia) % 360;
    let delta = desejadoMod - atualMod;
    if (delta <= 0) delta += 360;

    const voltasExtras = 5;
    totalDeg += voltasExtras * 360 + delta;

    const svg = document.getElementById("roda");
    svg.style.transform = `rotate(${totalDeg}deg)`;

    setTimeout(() => {
      mostrarResultado(DADOS[idx]);
      girando = false;
      document.getElementById("girarBtn").disabled = false;
    }, 3700);
  }

  function mostrarResultado(d) {
    const card = document.getElementById("resultadoCard");
    card.innerHTML = `
      <div class="resultado-numero">Roleta da Dor — d20 = ${d.n}</div>
      <div class="resultado-nome">${d.nome}</div>
      <div class="resultado-efeito">${d.efeito}</div>
    `;

    historico.unshift(d.n);
    if (historico.length > 12) historico.pop();
    document.getElementById("historicoLista").innerHTML = historico
      .map(n => `<span class="historico-chip">${n}</span>`)
      .join("");
  }

  montarRoda();
  document.getElementById("girarBtn").addEventListener("click", girar);
</script>
</body>
</html>
